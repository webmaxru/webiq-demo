name: Deploy to Azure

# Minimal CI/CD:
#   - validate: typecheck + lint + build (runs on PRs and pushes)
#   - deploy:   publishes and rolls the backend image from ghcr.io, then builds
#     the frontend with the Container App URL and uploads it to the provisioned
#     Azure Static Web Apps Free-tier resource.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch: {}

# Never run two deploys against the same environment at once, and never cancel a
# deploy that is already rolling a revision.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy (Static Web Apps + Container Apps)
    needs: validate
    # Only deploy on a push to main or a manual run — never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry (ghcr.io)
      id-token: write # required for OIDC login to Azure
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEBIQ_API_KEY: ${{ secrets.WEBIQ_API_KEY }}
      # ghcr.io/<owner>/<repo>, lowercased — the free registry that replaced ACR.
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure (OIDC, federated — no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Azure hosting resources
        id: hosting
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          APP_NAME=$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.\"azd-service-name\"=='app'].name | [0]" -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "::error::No Container App tagged azd-service-name=app in $AZURE_RESOURCE_GROUP. Run 'azd provision' first."
            exit 1
          fi
          API_HOST=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          SWA_ID=$(az resource list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.Web/staticSites \
            --query "[?tags.\"webiq-component\"=='frontend'].id | [0]" -o tsv)
          if [ -z "$SWA_ID" ]; then
            echo "::error::No Static Web App tagged webiq-component=frontend in $AZURE_RESOURCE_GROUP. Run 'azd provision' first."
            exit 1
          fi
          SWA_TOKEN=$(az rest \
            --method post \
            --url "https://management.azure.com${SWA_ID}/listSecrets?api-version=2023-12-01" \
            --query properties.apiKey -o tsv)
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Unable to obtain the Static Web Apps deployment token."
            exit 1
          fi
          echo "::add-mask::$SWA_TOKEN"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "api_url=https://$API_HOST" >> "$GITHUB_OUTPUT"
          echo "SWA_DEPLOYMENT_TOKEN=$SWA_TOKEN" >> "$GITHUB_ENV"

      - name: Roll the Container App onto the new image
        # Updating the immutable image tag creates a revision while preserving
        # scale-to-zero, CORS configuration, and monitoring settings. Sync the
        # encrypted repository key first so a rotated key reaches the new revision.
        run: |
          APP_NAME="${{ steps.hosting.outputs.app_name }}"
          if [ -z "$WEBIQ_API_KEY" ]; then
            echo "::error::The WEBIQ_API_KEY repository secret is not configured."
            exit 1
          fi
          az containerapp secret set \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "webiq-api-key=$WEBIQ_API_KEY" \
            --only-show-errors \
            >/dev/null
          echo "Rolling $APP_NAME to ${IMAGE}:${GITHUB_SHA}"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --only-show-errors

      - name: Verify backend authentication
        run: |
          RESPONSE_FILE=$(mktemp)
          STATUS=$(curl \
            --silent \
            --show-error \
            --max-time 120 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data '{"input":"Microsoft Web IQ","params":{"maxResults":1}}' \
            "${{ steps.hosting.outputs.api_url }}/api/search/web")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend Web IQ authentication check failed with HTTP $STATUS."
            jq -r '.error | "class=\(.class) code=\(.errorCode) message=\(.message)"' "$RESPONSE_FILE"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend for the Container App API
        env:
          VITE_API_BASE_URL: ${{ steps.hosting.outputs.api_url }}
        run: |
          npm ci
          npm run build:web

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: web/dist
          output_location: .
          skip_app_build: true
          skip_api_build: true
