name: Deploy to Azure

# Minimal CI/CD:
#   - validate: typecheck + lint + build (runs on PRs and pushes)
#   - deploy:   builds the container image, pushes it to GitHub Container Registry
#     (ghcr.io — free for this public repo, replaces Azure Container Registry), then
#     rolls the existing Azure Container App onto the new image with
#     `az containerapp update`. Infrastructure is provisioned out-of-band by the owner
#     with `azd provision` (see docs/deployment.md). Azure auth is OIDC/federated, so no
#     long-lived cloud secrets are stored; the image is pushed with the built-in
#     GITHUB_TOKEN.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch: {}

# Never run two deploys against the same environment at once, and never cancel a
# deploy that is already rolling a revision.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy (ghcr.io + Container Apps)
    needs: validate
    # Only deploy on a push to main or a manual run — never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry (ghcr.io)
      id-token: write # required for OIDC login to Azure
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      # ghcr.io/<owner>/<repo>, lowercased — the free registry that replaced ACR.
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure (OIDC, federated — no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the Container App onto the new image
        # Find the app by its azd-service-name tag (set in infra/modules/resources.bicep)
        # and update it to the immutable per-commit tag. `az containerapp update --image`
        # creates a new revision, preserving scale (minReplicas), secrets and env.
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          APP_NAME=$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.\"azd-service-name\"=='app'].name | [0]" -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "::error::No Container App tagged azd-service-name=app in $AZURE_RESOURCE_GROUP. Run 'azd provision' first."
            exit 1
          fi
          echo "Rolling $APP_NAME to ${IMAGE}:${GITHUB_SHA}"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --only-show-errors
